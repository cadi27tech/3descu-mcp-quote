name: live smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *' # daily, against the public server
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
